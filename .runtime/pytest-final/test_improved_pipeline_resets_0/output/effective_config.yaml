tracker:
  detection_threshold: 0.25
  max_age: 10
  min_hits: 1
  iou_threshold: 0.2
  delta_t: 2
  inertia: 0.2
  use_byte: false
scene_cut:
  backend: pyscenedetect
  content_threshold: 10.0
  min_scene_length: 1
  histogram_threshold: 0.4
reid:
  similarity_threshold: 0.8
  recovery_window_frames: 2
  gallery_size: 4
output:
  codec: mp4v
  save_sample_frames: 0
