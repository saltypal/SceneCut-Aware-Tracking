experiment:
  name: oppie_yolo11n_clean_boxes_cpu
  device: cpu
  process_all_frames: true
  videos:
    oppie: data/oppie.mp4
  methods:
    - ocsort
    - deep_ocsort
    - deep_ocsort_scenecut
  output_root: outputs/oppie_once
  detection_cache_root: outputs/detection_cache_oppie_once
  appearance_cache_root: outputs/appearance_cache_oppie_once
  gallery_filename: oppie_once_gallery.html
  manifest_filename: oppie_once_manifest.json
  gallery_title: Oppie — Updated Tracking Settings

detector:
  backend: ultralytics
  model: yolo11n.pt
  local_only: true
  # 0.70 left too many frames without a detection; 0.50 removes the
  # persistent partial-person proposals while retaining most main boxes.
  confidence: 0.50
  iou: 0.50
  image_size: 640
  person_class: 0
  max_detections: 20
  device: cpu

tracker:
  detection_threshold: 0.50
  max_age: 60
  min_hits: 3
  iou_threshold: 0.30
  delta_t: 3
  inertia: 0.20
  use_byte: false

deep_ocsort:
  weights: osnet_x0_25_msmt17.pt
  device: cpu
  half: false
  w_association_emb: 0.50
  alpha_fixed_emb: 0.95
  aw_param: 0.50
  embedding_off: false
  cmc_off: false
  aw_off: false

scene_cut:
  backend: pyscenedetect
  content_threshold: 27.0
  min_scene_length: 15
  hard_cut_histogram_threshold: 0.40
  hard_cut_pixel_threshold: 0.12
  histogram_threshold: 0.62

reid:
  weights: osnet_x0_25_msmt17.pt
  device: cpu
  similarity_threshold: 0.75
  recovery_window_frames: 15
  gallery_size: 20
  minimum_crop_width: 12
  minimum_crop_height: 24

evaluation:
  match_iou_threshold: 0.50
  cut_tolerance_frames: 2

output:
  codec: mp4v
  browser_codec: h264
  draw_confidence: true
  save_sample_frames: 6
