experiment:
  name: busrec_yolo11n_cpu
  device: cpu
  process_all_frames: true
  videos:
    busrec: data/busrec.mp4
    CarHighWay: data/CarHighWay.mp4
    BusRain: data/BusRain.mp4
  video_overrides:
    CarHighWay:
      detector:
        confidence: 0.25
      tracker:
        detection_threshold: 0.25
    BusRain:
      detector:
        confidence: 0.25
      tracker:
        detection_threshold: 0.25
  methods:
    - ocsort
    - deep_ocsort
    - deep_ocsort_scenecut
  output_root: outputs/busrec
  detection_cache_root: outputs/busrec_detection_cache
  appearance_cache_root: outputs/busrec_appearance_cache
  gallery_filename: busrec_gallery.html
  manifest_filename: busrec_manifest.json
  gallery_title: Car clips — YOLO11n tracking comparison

detector:
  backend: ultralytics
  model: yolo11n.pt
  local_only: true
  target_class: 2  # COCO car; excludes trucks, buses, and motorcycles.
  confidence: 0.70
  iou: 0.50
  image_size: 960
  max_detections: 100
  device: cpu

tracker:
  detection_threshold: 0.35
  max_age: 60
  min_hits: 3
  iou_threshold: 0.30
  delta_t: 3
  inertia: 0.20
  use_byte: true

deep_ocsort:
  weights: osnet_x0_25_msmt17.pt
  device: cpu
  half: false
  w_association_emb: 0.50
  alpha_fixed_emb: 0.95
  aw_param: 0.50
  embedding_off: false
  cmc_off: false
  aw_off: false

scene_cut:
  backend: pyscenedetect
  content_threshold: 27.0
  min_scene_length: 15
  hard_cut_histogram_threshold: 0.40
  hard_cut_pixel_threshold: 0.12
  histogram_threshold: 0.62

reid:
  weights: osnet_x0_25_msmt17.pt
  local_only: true
  device: cpu
  similarity_threshold: 0.75
  recovery_window_frames: 15
  gallery_size: 20
  minimum_crop_width: 12
  minimum_crop_height: 12

evaluation:
  match_iou_threshold: 0.50
  cut_tolerance_frames: 2

output:
  codec: mp4v
  browser_codec: h264
  draw_confidence: true
  save_sample_frames: 6
