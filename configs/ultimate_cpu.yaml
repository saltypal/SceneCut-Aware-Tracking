experiment:
  name: yolo11_five_video_four_method_tracking_comparison
  device: cpu
  process_all_frames: true
  videos:
    football-1: data/videos/desktop_clips/football-1.mp4
    football-2: data/videos/desktop_clips/football-2.mp4
    football-3: data/videos/desktop_clips/football-3.mp4
    MI6: data/MI6.mp4
    Joker: data/Joker.mp4
  methods:
    - ocsort
    - deep_ocsort
    - deep_ocsort_osnet
    - deep_ocsort_scenecut
  output_root: outputs/experiments
  detection_cache_root: outputs/detection_cache
  appearance_cache_root: outputs/appearance_cache

detector:
  backend: ultralytics
  model: yolo11n.pt
  confidence: 0.10
  iou: 0.70
  image_size: 960
  person_class: 0
  max_detections: 5
  device: cpu

tracker:
  # The shared YOLO cache retains detections down to 0.05. New OC-SORT tracks
  # need 0.25; BYTE can use 0.10-0.25 detections to maintain existing tracks.
  detection_threshold: 0.25
  max_age: 60
  min_hits: 3
  iou_threshold: 0.30
  delta_t: 3
  inertia: 0.20
  use_byte: true

deep_ocsort:
  weights: osnet_x0_25_msmt17.pt
  device: cpu
  half: false
  w_association_emb: 0.50
  alpha_fixed_emb: 0.95
  aw_param: 0.50
  embedding_off: false
  cmc_off: false
  aw_off: false

scene_cut:
  backend: pyscenedetect
  content_threshold: 27.0
  min_scene_length: 15
  # Require a global visual change as well as PySceneDetect's content score.
  # These guards prevent camera/player motion from repeatedly resetting tracks.
  hard_cut_histogram_threshold: 0.40
  hard_cut_pixel_threshold: 0.12
  histogram_threshold: 0.62

reid:
  weights: osnet_x0_25_msmt17.pt
  device: cpu
  similarity_threshold: 0.75
  recovery_window_frames: 15
  gallery_size: 20
  minimum_crop_width: 12
  minimum_crop_height: 24

evaluation:
  match_iou_threshold: 0.50
  cut_tolerance_frames: 2

output:
  codec: mp4v
  browser_codec: h264
  draw_confidence: true
  save_sample_frames: 6
