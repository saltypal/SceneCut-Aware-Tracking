detector:
  # Legacy single-video CLI configuration. The five-video comparison uses
  # configs/ultimate_cpu.yaml instead. No model is trained here.
  backend: ultralytics
  model: yolo11n.pt
  weights: yolo11n.pt
  confidence: 0.85
  iou: 0.50
  image_size: 640
  person_class: 0
  max_detections: 5
  device: cpu

tracker:
  detection_threshold: 0.60
  max_age: 30
  min_hits: 3
  iou_threshold: 0.30
  delta_t: 3
  inertia: 0.20
  use_byte: true

  # BYTE first creates/matches tracks with detections above detection_threshold.
  # Its second pass can reconnect existing tracks using weaker detections.

scene_cut:
  backend: pyscenedetect
  content_threshold: 42.0
  min_scene_length: 45
  histogram_threshold: 0.7

reid:
  weights: osnet_x0_25_msmt17.pt
  device: cpu
  similarity_threshold: 0.085
  recovery_window_frames: 30
  gallery_size: 20
  minimum_crop_width: 16
  minimum_crop_height: 32

evaluation:
  match_iou_threshold: 0.50
  cut_tolerance_frames: 2

output:
  codec: mp4v
  draw_confidence: true
  save_sample_frames: 6
